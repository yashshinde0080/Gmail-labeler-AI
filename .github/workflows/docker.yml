# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions — CI/CD pipeline
#
# On every push to main:
#   1. Run the test suite.
#   2. Build the Docker image to verify it compiles.
#   3. Trigger a Render deploy hook (optional — set RENDER_DEPLOY_HOOK_URL
#      in GitHub repository secrets to enable automatic deploys).
# ─────────────────────────────────────────────────────────────────────────────
name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create minimal .env for tests
        run: |
          cat > .env << 'EOF'
          GROQ_API_KEY=test_key_not_real
          GMAIL_CLIENT_ID=test_client_id
          GMAIL_CLIENT_SECRET=test_secret
          GMAIL_REFRESH_TOKEN=test_refresh_token
          DATABASE_URL=sqlite:///./test.db
          LOG_LEVEL=WARNING
          SCHEDULER_ENABLED=false
          POLL_INTERVAL_SECONDS=30
          EOF

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -v \
            --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Docker build check ──────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gmail-ai-labeler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Render ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    # Only deploy on pushes to main (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -sSf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy hook triggered successfully"
